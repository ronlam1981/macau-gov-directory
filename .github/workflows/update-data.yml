name: 每日自動更新資料庫

on:
  schedule:
    - cron: "0 23 * * *" # 每日 23:00 UTC = 澳門時間早上 07:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: 執行更新腳本
        run: python3 updatedata.py

      - name: 提交並推送變更（如有）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md Rawdata/
          if git diff --cached --quiet; then
            echo "資料無變更，跳過提交。"
          else
            git commit -m "自動更新：政府部門通訊錄資料庫 $(date -u +'%Y-%m-%d')"
            git push
          fi
